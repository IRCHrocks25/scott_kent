<header id="header" class="bg-white shadow-sm sticky top-0 z-50 transition-all duration-500 ease-out">
    <div class="max-w-7xl mx-auto px-6">
        <div class="flex justify-between items-center py-5">
            <div class="text-2xl font-bold text-primary">
                {% if site_settings.logo %}
                    <img src="{{ site_settings.logo.url }}" alt="{{ site_settings.site_name }}" class="h-10">
                {% else %}
                    {{ site_settings.site_name|default:"Scott & Shannon Kent" }}
                {% endif %}
            </div>
            <nav class="flex items-center gap-8">
                <ul class="hidden md:flex gap-8 list-none">
                    {% for link in nav_links %}
                        <li><a href="{{ link.url }}" class="text-gray-600 font-medium hover:text-primary transition-colors">{{ link.label }}</a></li>
                    {% endfor %}
                </ul>
                <a href="{{ site_settings.primary_cta_url|default:'#' }}" class="inline-block px-8 py-3 bg-primary text-white font-semibold rounded-2xl shadow-md hover:bg-primary-dark hover:-translate-y-1 hover:shadow-xl hover:scale-[1.02] transition-all duration-300 ease-out">
                    {{ site_settings.primary_cta_text|default:"Book Diagnostic"|cut:"👉" }}
                </a>
            </nav>
        </div>
    </div>
</header>
