{% if final_cta.show_section %}
<section class="relative py-28 md:py-36 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-center overflow-hidden">
    
    <!-- Background glow effects -->
    <div class="absolute -top-20 left-1/4 w-96 h-96 bg-cyan-500/10 blur-3xl rounded-full"></div>
    <div class="absolute bottom-0 right-1/3 w-[28rem] h-[28rem] bg-blue-500/10 blur-3xl rounded-full"></div>
    
    <div class="relative max-w-4xl mx-auto px-6 z-10">

        <!-- Overline -->
        <p class="text-xs font-semibold tracking-[0.26em] uppercase text-cyan-300/90 mb-6">
            Your next move
        </p>

        <!-- Headline -->
        <h2 class="text-4xl md:text-6xl font-bold mb-10 text-white leading-tight max-w-3xl mx-auto" style="text-shadow: 0 4px 12px rgba(0,0,0,0.6);">
            {{ final_cta.headline }}
        </h2>

        <!-- Subcopy with better formatting -->
        {% if final_cta.body_text %}
        <div class="text-lg md:text-xl text-white/95 mb-14 max-w-2xl mx-auto leading-relaxed space-y-6" style="text-shadow: 0 2px 8px rgba(0,0,0,0.5); color: #ffffff !important;">
            {{ final_cta.body_text|linebreaks }}
        </div>
        {% endif %}

        <!-- Signature CTA with enhanced design -->
        <div class="flex flex-col items-center gap-6 mb-4">
            <a href="{{ final_cta.cta_url }}"
               class="group relative inline-flex items-center justify-center gap-3
                      rounded-full px-12 md:px-16 py-5 md:py-5.5
                      text-base md:text-lg font-bold
                      text-white
                      bg-gradient-to-r from-cyan-500 via-sky-500 to-blue-600
                      shadow-[0_0_40px_rgba(56,189,248,0.6)]
                      hover:shadow-[0_0_60px_rgba(56,189,248,0.9)]
                      hover:scale-[1.03]
                      active:scale-[0.98]
                      transition-all duration-300
                      border border-cyan-400/30">

                <!-- Glow effect -->
                <span class="absolute inset-0 rounded-full bg-white/20 blur-xl opacity-0 group-hover:opacity-100 transition-opacity"></span>
                
                <!-- Icon chip -->
                <span class="relative inline-flex h-8 w-8 items-center justify-center rounded-full
                             bg-white/15 group-hover:bg-white/25 transition-colors backdrop-blur-sm">
                    <i class="fas fa-arrow-trend-up text-sm"></i>
                </span>

                <span class="relative">{{ final_cta.cta_label|safe|cut:"👉" }}</span>
            </a>

            <!-- Reassurance line with better styling -->
            <div class="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-white/5 border border-white/10 backdrop-blur-sm">
                <i class="fas fa-check-circle text-cyan-400 text-sm"></i>
                <p class="text-sm md:text-base text-slate-200 leading-relaxed" style="color: #e2e8f0 !important;">
                    One focused conversation to see where your systems are holding you back—and how to fix it.
                </p>
            </div>
        </div>

    </div>
</section>
{% endif %}
