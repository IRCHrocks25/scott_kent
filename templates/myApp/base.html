<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Scott & Shannon Kent{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a5f',
                        'primary-dark': '#0f1f35',
                        accent: '#2d7d7d',
                        'accent-light': '#4a9d9d',
                        highlight: '#d4a574',
                    },
                    fontFamily: {
                        heading: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        /* Prevent orphan words - ensure at least 3 words per line */
        p, h1, h2, h3, h4, h5, h6, div, span, li {
            text-wrap: pretty;
            orphans: 3;
            widows: 3;
        }
        /* Better line breaking */
        body {
            word-break: normal;
            overflow-wrap: break-word;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    {% include 'myApp/partials/header.html' %}
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    {% include 'myApp/partials/footer.html' %}
    
    {% block extra_js %}{% endblock %}
</body>
</html>
