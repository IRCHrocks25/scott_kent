<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Scott & Shannon Kent{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a5f',
                        'primary-dark': '#0f1f35',
                        accent: '#2d7d7d',
                        'accent-light': '#4a9d9d',
                        highlight: '#d4a574',
                    },
                    fontFamily: {
                        sans: ['"Red Hat Display"', 'ui-sans-serif', 'system-ui', '-apple-system', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', '"Apple Color Emoji"', '"Segoe UI Emoji"'],
                        heading: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        /* Prevent orphan words - ensure at least 3 words per line */
        p, h1, h2, h3, h4, h5, h6, div, span, li {
            text-wrap: pretty;
            orphans: 3;
            widows: 3;
        }
        /* Better line breaking */
        body {
            word-break: normal;
            overflow-wrap: break-word;
        }
        
        /* Premium transitions and animations */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .animate-fade-in {
            opacity: 0;
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        .animate-slide-up {
            opacity: 0;
            transform: translateY(40px);
            animation: slideUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        .animate-scale-in {
            opacity: 0;
            transform: scale(0.95);
            animation: scaleIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }
        
        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes scaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Stagger delays for grid items */
        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }
        .stagger-5 { animation-delay: 0.5s; }
        
        /* Smooth hover transitions for all interactive elements */
        .card, .btn, a, button, .testimonial-card, .stat-card {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform, opacity, box-shadow;
        }
        
        /* Premium section transitions */
        section {
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Enhanced card hover effects */
        .card:hover {
            transform: translateY(-8px) scale(1.01);
        }
        
        /* Smooth button interactions */
        .btn:hover, a.btn:hover {
            transform: translateY(-2px) scale(1.02);
        }
        
        .btn:active, a.btn:active {
            transform: translateY(0) scale(0.98);
        }
        
        /* Smooth image transitions */
        img {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s ease;
        }
        
        .card:hover img, .hover\:scale-105:hover img {
            transform: scale(1.05);
        }
        
        /* Smooth icon transitions */
        i, svg {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card:hover i, .btn:hover i {
            transform: scale(1.1);
        }
        
        /* Gradient animation for buttons */
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .bg-gradient-to-r {
            background-size: 200% 200%;
            animation: gradient-shift 8s ease infinite;
        }
        
        /* Smooth backdrop blur transitions */
        .backdrop-blur-sm, .backdrop-blur-md {
            transition: backdrop-filter 0.5s ease;
        }
        
        /* Smooth border color transitions */
        [class*="border"] {
            transition: border-color 0.3s ease;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    {% include 'myApp/partials/header.html' %}
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    {% include 'myApp/partials/footer.html' %}
    
    {% block extra_js %}{% endblock %}
    
    <script>
        // Premium scroll animations with Intersection Observer
        (function() {
            'use strict';
            
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            
            if (prefersReducedMotion) {
                // Still add visible class but skip animations
                document.querySelectorAll('.animate-on-scroll').forEach(el => {
                    el.classList.add('visible');
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
                return;
            }
            
            // Intersection Observer for scroll animations with smooth easing
            const observerOptions = {
                threshold: 0.15,
                rootMargin: '0px 0px -100px 0px'
            };
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        const element = entry.target;
                        const stagger = element.dataset.stagger ? parseInt(element.dataset.stagger) * 120 : 0;
                        
                        setTimeout(() => {
                            element.classList.add('visible');
                            element.style.opacity = '1';
                            element.style.transform = 'translateY(0)';
                            element.style.transition = 'opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
                        }, stagger);
                        
                        observer.unobserve(element);
                    }
                });
            }, observerOptions);
            
            // Observe all sections with smooth entrance
            document.querySelectorAll('section').forEach((section) => {
                if (!section.classList.contains('animate-on-scroll')) {
                    section.classList.add('animate-on-scroll');
                }
                section.dataset.stagger = '0';
                observer.observe(section);
            });
            
            // Observe all cards and interactive elements with stagger
            document.querySelectorAll('.card, .grid > *, .testimonial-card, .stat-card, .methodology-step, .animate-on-scroll').forEach((element) => {
                if (!element.dataset.stagger) {
                    const parent = element.closest('.grid, .space-y-10');
                    if (parent) {
                        const siblings = Array.from(parent.children);
                        const index = siblings.indexOf(element);
                        element.dataset.stagger = (index % 5).toString();
                    }
                }
                observer.observe(element);
            });
            
            // Premium header scroll behavior with smooth transitions
            let lastScroll = 0;
            let ticking = false;
            const header = document.getElementById('header');
            
            function updateHeader() {
                const currentScroll = window.pageYOffset;
                
                if (header) {
                    if (currentScroll > 80) {
                        header.style.padding = '0.75rem 0';
                        header.style.boxShadow = '0 4px 20px rgba(0,0,0,0.1)';
                        header.classList.add('scrolled');
                    } else {
                        header.style.padding = '';
                        header.style.boxShadow = '';
                        header.classList.remove('scrolled');
                    }
                }
                
                lastScroll = currentScroll;
                ticking = false;
            }
            
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(updateHeader);
                    ticking = true;
                }
            }, { passive: true });
            
            // Smooth parallax effect for hero section
            const hero = document.querySelector('section:first-of-type');
            if (hero) {
                let heroTicking = false;
                window.addEventListener('scroll', () => {
                    if (!heroTicking) {
                        window.requestAnimationFrame(() => {
                            const scrolled = window.pageYOffset;
                            const heroContent = hero.querySelector('.max-w-5xl, .max-w-7xl, .relative');
                            if (heroContent && scrolled < hero.offsetHeight * 1.5) {
                                const parallax = scrolled * 0.15;
                                heroContent.style.transform = `translateY(${parallax}px)`;
                                heroContent.style.opacity = Math.max(0.7, 1 - (scrolled / hero.offsetHeight) * 0.2);
                            }
                            heroTicking = false;
                        });
                        heroTicking = true;
                    }
                }, { passive: true });
            }
            
            // Add smooth hover effects to all cards
            document.querySelectorAll('.card').forEach(card => {
                card.addEventListener('mouseenter', function() {
                    this.style.transition = 'all 0.5s cubic-bezier(0.4, 0, 0.2, 1)';
                });
            });
            
            // Smooth scroll for anchor links
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    if (href !== '#' && href.length > 1) {
                        const target = document.querySelector(href);
                        if (target) {
                            e.preventDefault();
                            target.scrollIntoView({
                                behavior: 'smooth',
                                block: 'start'
                            });
                        }
                    }
                });
            });
        })();
    </script>
</body>
</html>
